<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ronny: a Shiba Inu wearing a number 10 collar tag shaped like an envelope">
  <title>Ronny</title>

  <!--
    Ronny — a Shiba Inu with Ronaldinho's grin.

    Built as a template for a kennel of agents: the ring, the collar and the
    tag are the constant frame, and only the dog inside changes. To make a
    sibling, keep everything outside the "dog" group and redraw that, then
    swap the glyph on the tag for whatever that one does. Same ring, same
    collar, same 256x256 grid, so a row of them lines up.

    The palette nods at Brazil without imitating any real crest or badge:
    brand green and yellow against the Shiba's own red-sesame coat, which
    happens to sit close to the yellow already.
  -->
  <defs>
    <style>
      .ring   { fill: #0E7A3C; }
      .field  { fill: #FBF0DF; }
      .coat   { fill: #D9762F; }
      .coat-d { fill: #B75C1E; }
      .cream  { fill: #FBF0DF; }
      .ink    { fill: #2A1C12; }
      .tongue { fill: #E4645E; }
      .gold   { fill: #F7C325; }
    </style>
  </defs>

  <!-- Frame: constant across the kennel -->
  <circle class="ring" cx="128" cy="128" r="128"/>
  <circle class="field" cx="128" cy="128" r="116"/>

  <g id="dog">
    <!-- Ears. Small, upright and set wide: the most reliable Shiba tell. -->
    <path class="coat" d="M74 84 L56 28 L112 58 Z"/>
    <path class="coat" d="M182 84 L200 28 L144 58 Z"/>
    <path class="tongue" d="M80 78 L70 46 L102 64 Z" opacity="0.55"/>
    <path class="tongue" d="M176 78 L186 46 L154 64 Z" opacity="0.55"/>

    <!-- The ruff. Drawn as pointed tufts behind the head rather than round
         blobs, which read as spare ears. A Shiba's cheek fur really does
         flare like this, so it carries the Ronaldinho curls without putting
         human hair on a dog. -->
    <path class="coat-d" d="M84 96
      Q 48 106 74 124  Q 44 140 76 156  Q 52 176 92 184  L 100 96 Z"/>
    <path class="coat-d" d="M172 96
      Q 208 106 182 124  Q 212 140 180 156  Q 204 176 164 184  L 156 96 Z"/>

    <!-- Head: broad forehead tapering to the muzzle -->
    <path class="coat" d="M128 44
      C 174 44 200 74 200 112
      C 200 148 164 190 128 202
      C 92 190 56 148 56 112
      C 56 74 82 44 128 44 Z"/>

    <!-- Urajiro: the cream markings on cheeks, brows and muzzle. Without
         these it is just an orange dog. -->
    <path class="cream" d="M128 118
      C 158 118 176 136 176 158
      C 176 182 154 198 128 202
      C 102 198 80 182 80 158
      C 80 136 98 118 128 118 Z"/>
    <path class="cream" d="M84 96 C 92 86 108 86 114 92 C 106 92 92 96 84 96 Z"/>
    <path class="cream" d="M172 96 C 164 86 148 86 142 92 C 150 92 164 96 172 96 Z"/>

    <!-- Eyes: almond, tilted up at the outer corner -->
    <path class="ink" d="M86 112 C 94 102 112 102 118 112 C 112 122 94 122 86 112 Z"/>
    <path class="ink" d="M138 112 C 144 102 162 102 170 112 C 162 122 144 122 138 112 Z"/>
    <circle class="field" cx="100" cy="109" r="3"/>
    <circle class="field" cx="158" cy="109" r="3"/>

    <!-- Nose -->
    <path class="ink" d="M128 132 C 138 132 143 138 138 144 C 134 149 122 149 118 144 C 113 138 118 132 128 132 Z"/>

    <!-- The grin. This is the Ronaldinho part: wide, open, unmistakably
         pleased with itself. The teeth strip is what stops an open mouth
         reading as a snarl. -->
    <path class="ink" d="M128 150
      C 152 150 168 158 168 170
      C 168 186 150 196 128 196
      C 106 196 88 186 88 170
      C 88 158 104 150 128 150 Z"/>
    <path class="field" d="M94 162 C 108 155 148 155 162 162 C 148 167 108 167 94 162 Z"/>
    <path class="tongue" d="M112 178 C 120 174 136 174 144 178 C 144 190 136 194 128 194 C 120 194 112 190 112 178 Z"/>
  </g>

  <!-- Collar and tag: the other constant. The tag is an envelope, because
       this one reads mail; a sibling that does something else changes the
       glyph and keeps the shape. The 10 is the only other Ronaldinho cue
       it needs. -->
  <path class="ring" d="M62 196 C 90 216 166 216 194 196 L 194 212 C 166 232 90 232 62 212 Z"/>
  <g transform="translate(128 220)">
    <rect class="gold" x="-22" y="-15" width="44" height="30" rx="4"/>
    <path fill="none" stroke="#2A1C12" stroke-width="2.4" stroke-linejoin="round" d="M-22 -11 L0 4 L22 -11"/>
    <text x="0" y="13" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="13" font-weight="bold" fill="#2A1C12">10</text>
  </g>
</svg>
